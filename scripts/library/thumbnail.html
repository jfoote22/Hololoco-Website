<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<!-- Renders one library GLB on a transparent background. render-thumbnails.mjs screenshots it. -->
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const id = new URLSearchParams(location.search).get("id");
const size = Number(new URLSearchParams(location.search).get("size") || 256);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfc9cf, 2.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1, 2, 3);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 10);
camera.position.set(1.05, 1.1, 1.95);
camera.lookAt(0, 0.45, 0);

const gltf = await new GLTFLoader().loadAsync(`/public/library/${id}.glb`);
scene.add(gltf.scene);
renderer.render(scene, camera);
document.title = "ready";
</script>
</body>
</html>
